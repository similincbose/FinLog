org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9's new DSL cannot coexist with the Kotlin Multiplatform plugin's
# androidTarget() in a module that also applies com.android.application. The
# documented alternative is splitting this into an Android app module plus a KMP
# library module using com.android.kotlin.multiplatform.library. Until that
# restructure happens, this keeps the single-module layout working.
# See https://kotl.in/gradle/agp-new-kmp
android.newDsl=false
android.builtInKotlin=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

# Compose Multiplatform resources / iOS
org.jetbrains.compose.experimental.uikit.enabled=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
